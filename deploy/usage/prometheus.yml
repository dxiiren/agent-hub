global: {scrape_interval: 15s}
rule_files: [/etc/prometheus/rules.yml]
scrape_configs:
  - {job_name: otel, static_configs: [{targets: ['collector:8889']}]}
  # SGLang and llama-server /metrics: targets come from targets/targets.yml (no hosts in this repo)
  - job_name: llm-servers
    file_sd_configs: [{files: ['/etc/prometheus/targets/*.yml']}]
  # Host pollers (Qoder, OpenCode, limit %): pollers/run-pollers.* listens on 9109
  - {job_name: pollers, static_configs: [{targets: ['host.docker.internal:9109']}]}
